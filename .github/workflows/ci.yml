name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with sweep.yml and docs/development/quality-gates.md.
  LYCHEE_VERSION: v0.24.2
  # Keep in sync with docs/development/quality-gates.md.
  GITLEAKS_VERSION: 8.30.1

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # verify runs check:links, which needs the lychee binary (see scripts/check-links.sh).
      - name: Install lychee
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verify-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:md
      - run: npm run docs:api:check
      # Relative links and #anchors only; external URLs are checked by the daily sweep.
      - uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: ${{ env.LYCHEE_VERSION }}
          args: --offline --include-fragments --no-progress .
          fail: true
          jobSummary: true

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and then deleted is still leaked.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: sh scripts/check-secrets.sh --all

  responsive:
    name: responsive (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same image (and Playwright version) that generates the screenshot baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    env:
      HOME: /root
      PW_VISUAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: responsive-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
