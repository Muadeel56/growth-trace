# Link checker config (https://lychee.cli.rs). Used by `npm run check:links` (offline:
# relative links and #anchors only), `npm run check:links:remote`, pre-commit, CI and the
# daily sweep (.github/workflows/sweep.yml). See docs/development/quality-gates.md.

# Anchor links such as BRD.md#8-timeline--milestones must resolve to a real heading.
include_fragments = "full"

# Remote results are cached in .lycheecache (gitignored) so repeat runs stay fast.
cache = true
max_cache_age = "1d"

# 429 means "rate limited", not "broken"; the sweep retries on its next run.
accept = ["200..=206", "429"]

max_retries = 3
timeout = 20
no_progress = true

exclude = [
  # Local dev servers aren't running when links are checked.
  '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)',
  # GitHub pages that need a signed-in session.
  '^https://github\.com/settings',
]

exclude_path = [
  'node_modules',
  # Generated by `next dev`; links point into node_modules.
  'frontend/AGENTS\.md',
]
